<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<title>WEB問診票｜ほりえ薬局 西長堀店</title>
<script src="https://ajaxzip3.github.io/ajaxzip3.js"></script>
<style>
*{box-sizing:border-box;}
body{margin:0;color:#33463f;-webkit-text-size-adjust:100%;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Helvetica Neue",Arial,sans-serif;}
form{max-width:460px;margin:0 auto;}
input[type=text],input[type=tel]{width:100%;font-size:16px;color:#33463f;font-family:inherit;}
input::placeholder{color:#b3c2bc;}
.row{display:flex;gap:10px;} .row .field{flex:1;min-width:0;}
.choices{display:grid;}
.choice{display:flex;align-items:center;gap:10px;cursor:pointer;}
.choice input{margin:0;flex-shrink:0;}
.note{text-align:center;font-size:12px;color:#7a8e86;margin-top:10px;line-height:1.7;}
button[type=submit]{width:100%;border:none;color:#fff;font-weight:bold;font-family:inherit;cursor:pointer;}
button[type=submit]:disabled{opacity:.6;}
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.94);display:none;flex-direction:column;
 align-items:center;justify-content:center;z-index:100;text-align:center;padding:16px;}
.overlay.show{display:flex;}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid #e8f7ef;border-top-color:#5fb48f;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay .msg{margin-top:16px;font-size:17px;font-weight:bold;color:#4a9a77;}
.overlay .sub{margin-top:8px;font-size:13px;color:#7a8e86;line-height:1.7;}
.overlay .slow{display:none;margin-top:14px;font-size:13px;color:#c06a7e;}

body{background:#e8f7ef;padding:0 0 40px;}
.header{background:#5fb48f;color:#fff;padding:18px 16px 18px;}
.header .inner{max-width:460px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.chara-wrap{width:64px;height:64px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chara{width:50px;height:auto;}
.header h1{margin:0;font-size:20px;letter-spacing:.05em;}
.kicker{font-size:12px;margin-top:3px;opacity:.9;letter-spacing:.1em;}
.lead{max-width:460px;margin:16px auto 12px;padding:0 18px;font-size:13px;color:#4a6b63;line-height:1.7;}
form{padding:0 12px;}
.card{background:#fff;border:1px solid #d6ebe0;border-radius:14px;padding:16px 16px 18px;margin-bottom:12px;}
.card-title{display:inline;font-size:16px;font-weight:bold;color:#33463f;
 background:linear-gradient(transparent 62%, #fbd3dc 62%);padding:0 2px;}
.card-title .num{display:none;}
.hint{font-size:12px;color:#7a8e86;margin:10px 0 0;}
.field{margin-top:14px;}
.field>label,.q{display:block;font-size:14px;font-weight:bold;color:#4a6b63;margin-bottom:6px;}
.req{font-size:11px;color:#fff;background:#e8a0b1;border-radius:3px;padding:1px 5px;margin-left:4px;font-weight:normal;}
.opt{font-size:11px;color:#7a8e86;margin-left:4px;font-weight:normal;}
input[type=text],input[type=tel]{padding:12px;border:1px solid #cfe3d9;border-radius:8px;background:#fff;}
input[type=text]:focus,input[type=tel]:focus{outline:none;border-color:#5fb48f;border-width:2px;padding:11px;}
.choices{gap:6px;}
.choice{padding:11px 12px;border:1px solid #d6ebe0;border-radius:8px;font-size:15px;background:#fff;}
.choice input{width:18px;height:18px;accent-color:#5fb48f;}
.choice:has(input:checked){background:#5fb48f;border-color:#5fb48f;color:#fff;font-weight:bold;}
.choice:has(input:checked) input{accent-color:#fff;}
.choices.pink .choice:has(input:checked){background:#f3a6b7;border-color:#f3a6b7;}
.submit-area{max-width:460px;margin:8px auto 0;padding:0 12px;}
button[type=submit]{background:#f3a6b7;color:#fff;padding:16px;border-radius:12px;font-size:17px;border-bottom:3px solid #db8ea0;}
button[type=submit]:active{transform:translateY(2px);border-bottom-width:1px;}
</style>
</head>
<body>

<header class="header">
  <div class="inner">
    <span class="chara-wrap"><img class="chara" src="character.png" alt=""></span>
    <div class="title">
      <h1>ほりえ薬局 西長堀店</h1>
      <div class="kicker">WEB問診票</div>
    </div>
  </div>
</header>
<p class="lead">ご来局前にご記入いただくと、<br>お薬のお渡しがスムーズになります。</p>

<form id="monshinForm" action="https://script.google.com/macros/s/AKfycbwQg2BLecwUqLUlgV-Sxs-fzdRYtsiIgmoTVqu8moZJqD2NK0pbsIKFhMdHtTCbMEd_iw/exec" method="post" autocomplete="on">

  <!-- 1. お名前・ご連絡先 -->
  <div class="card">
    <div class="card-title"><span class="num">1</span>お名前・ご連絡先</div>

    <div class="row">
      <div class="field">
        <label for="lastName">姓 <span class="req">必須</span></label>
        <input type="text" id="lastName" name="lastName" autocomplete="family-name" placeholder="堀江" required>
      </div>
      <div class="field">
        <label for="firstName">名 <span class="req">必須</span></label>
        <input type="text" id="firstName" name="firstName" autocomplete="given-name" placeholder="花子" required>
      </div>
    </div>

    <div class="field">
      <label for="phone">電話番号 <span class="req">必須</span></label>
      <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="例：09012345678" required>
    </div>
  </div>

  <!-- 2. ご住所 -->
  <div class="card">
    <div class="card-title"><span class="num">2</span>ご住所</div>
    <p class="hint">郵便番号を入れると住所が自動で入ります。</p>

    <div class="field">
      <label for="zipCode">郵便番号 <span class="req">必須</span></label>
      <input type="text" id="zipCode" name="zipCode"
        autocomplete="postal-code"
        inputmode="numeric"
        pattern="\d{7}"
        placeholder="例：5500005（ハイフンなし）"
        title="郵便番号は数字7桁で入力してください"
        required>
    </div>

    <div class="field">
      <label for="pref">都道府県 <span class="req">必須</span></label>
      <input type="text" id="pref" name="pref" autocomplete="address-level1" required>
    </div>

    <div class="field">
      <label for="city">市区町村 <span class="req">必須</span></label>
      <input type="text" id="city" name="city" autocomplete="address-level2" required>
    </div>

    <div class="field">
      <label for="addr">町名・番地・マンション名 <span class="req">必須</span></label>
      <input type="text" id="addr" name="addr" autocomplete="street-address" required>
    </div>
  </div>

  <!-- 3. お薬について -->
  <div class="card">
    <div class="card-title"><span class="num">3</span>お薬について</div>

    <div class="field">
      <div class="q">お薬手帳について <span class="req">必須</span></div>
      <div class="choices">
        <label class="choice"><input type="radio" name="medBook" value="手帳アプリ使用中" required>手帳アプリ使用中</label>
        <label class="choice"><input type="radio" name="medBook" value="紙の手帳持参">紙の手帳持参</label>
        <label class="choice"><input type="radio" name="medBook" value="手帳忘れ" checked>手帳忘れ</label>
        <label class="choice"><input type="radio" name="medBook" value="新規作成希望（アプリ）">新規作成希望（アプリ）</label>
        <label class="choice"><input type="radio" name="medBook" value="新規作成希望（手帳）">新規作成希望（手帳）</label>
      </div>
    </div>

    <div class="field">
      <div class="q">使用中の薬について <span class="req">必須</span></div>
      <div class="choices">
        <label class="choice"><input type="radio" name="currentMed" value="定期的に使っている薬がある" required>定期的に使っている薬がある</label>
        <label class="choice"><input type="radio" name="currentMed" value="たまに使用する薬あり">たまに使用する薬あり</label>
        <label class="choice"><input type="radio" name="currentMed" value="特になし" checked>特になし</label>
      </div>
    </div>
  </div>

  <!-- 4. 該当する方のみ -->
  <div class="card">
    <div class="card-title"><span class="num">4</span>該当する方のみ</div>

    <div class="field">
      <div class="q">女性の方にお伺いします <span class="opt">任意</span></div>
      <div class="choices pink">
        <label class="choice"><input type="radio" name="femaleCheck" value="妊娠中（4か月まで）">妊娠中（4か月まで）</label>
        <label class="choice"><input type="radio" name="femaleCheck" value="妊娠中（4か月以降）">妊娠中（4か月以降）</label>
        <label class="choice"><input type="radio" name="femaleCheck" value="妊娠の可能性あり">妊娠の可能性あり</label>
        <label class="choice"><input type="radio" name="femaleCheck" value="授乳中">授乳中</label>
        <label class="choice"><input type="radio" name="femaleCheck" value="">該当しない</label>
      </div>
    </div>

    <div class="field">
      <label for="childWeight">お子様の体重（15歳未満） <span class="opt">任意</span></label>
      <input type="text" id="childWeight" name="childWeight" inputmode="decimal" placeholder="例：18.5（kg）">
    </div>
  </div>

  <!-- いたずら送信対策（人には見えない欄。触らないでください） -->
  <div style="position:absolute;left:-9999px;top:-9999px;" aria-hidden="true">
    <label for="website">この欄は空のままにしてください</label>
    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
  </div>

  <div class="submit-area">
    <button type="submit" id="submitBtn">この内容で送信する</button>
    <p class="note">送信には10秒ほどかかることがあります。<br>ボタンは1回だけ押してください。</p>
  </div>
</form>

<!-- 送信中の画面 -->
<div class="overlay" id="overlay" aria-live="polite">
  <div class="spinner"></div>
  <div class="msg">送信しています…</div>
  <div class="sub">画面を閉じたり、戻ったりせずに<br>そのままお待ちください。</div>
  <div class="slow" id="slowMsg">通信に時間がかかっています。<br>もうしばらくお待ちください。</div>
</div>

<script>
(function(){
  var form    = document.getElementById('monshinForm');
  var btn     = document.getElementById('submitBtn');
  var overlay = document.getElementById('overlay');
  var slowMsg = document.getElementById('slowMsg');
  var zip     = document.getElementById('zipCode');
  var addr    = document.getElementById('addr');
  var sending = false;
  var slowTimer = null;

  // 郵便番号：全角数字→半角、ハイフンや〒などを除去
  function normalizeZip(s){
    return s.replace(/[０-９]/g, function(c){
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    }).replace(/[^0-9]/g, '');
  }

  zip.addEventListener('input', function(e){
    var n = normalizeZip(zip.value);
    if (n !== zip.value) zip.value = n;

    // スマホの住所自動入力で入った場合は、AjaxZip3で上書きしない
    var isAutofill = !(typeof InputEvent !== 'undefined' && e instanceof InputEvent) ||
                     e.inputType === 'insertReplacementText';
    if (isAutofill) return;

    if (n.length === 7 && typeof AjaxZip3 !== 'undefined') {
      AjaxZip3.zip2addr(zip, '', 'pref', 'city', 'addr');
      setTimeout(function(){ addr.focus(); }, 500);
    }
  });

  var THANKYOU_URL = 'https://horiepharmacy.github.io/HoriePharmacy-icon/thankyou.html';

  // 送信ごとの番号（同じ内容が二重に保存されるのを防ぐ）
  function makeSubmitId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now() + '-' + Math.random().toString(36).slice(2);
  }
  var submitId = makeSubmitId();

  function resetForm(){
    sending = false;
    btn.disabled = false;
    btn.textContent = 'この内容で送信する';
    overlay.classList.remove('show');
    slowMsg.style.display = 'none';
    clearTimeout(slowTimer);
  }

  // 送信：画面を移動せずに裏で送信 → 完了したら完了ページへ
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (sending) return;

    // fetchが使えない古い端末は、従来どおりの送信方法で送る
    if (!window.fetch || !window.URLSearchParams || !window.FormData) {
      sending = true;
      btn.disabled = true;
      btn.textContent = '送信中…';
      overlay.classList.add('show');
      form.submit();
      return;
    }

    sending = true;
    btn.disabled = true;
    btn.textContent = '送信中…';
    overlay.classList.add('show');
    slowTimer = setTimeout(function(){ slowMsg.style.display = 'block'; }, 12000);

    var data = new URLSearchParams(new FormData(form));
    data.append('mode', 'fetch');
    data.append('submitId', submitId);

    var controller = window.AbortController ? new AbortController() : null;
    var abortTimer = controller ? setTimeout(function(){ controller.abort(); }, 60000) : null;

    fetch(form.action, {
      method: 'POST',
      body: data,
      signal: controller ? controller.signal : undefined
    })
    .then(function(res){ return res.json(); })
    .then(function(result){
      clearTimeout(abortTimer);
      if (result && result.ok) {
        window.location.href = THANKYOU_URL;
      } else {
        throw new Error('save failed');
      }
    })
    .catch(function(){
      clearTimeout(abortTimer);
      resetForm();
      alert('送信できませんでした。\n電波の良い場所で、もう一度「送信する」を押してください。\n（何度も失敗する場合は、お手数ですが薬局窓口でお申し付けください）');
    });
  });

  // ブラウザの「戻る」で戻ってきたときは元の状態に戻す
  window.addEventListener('pageshow', function(e){
    if (e.persisted) resetForm();
  });
})();
</script>

</body>
</html>
